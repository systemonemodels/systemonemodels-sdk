name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# uv at a fixed version, checked against its sha256: no run picks up a uv
# release nobody chose. To move it, take the sha256 of
# uv-x86_64-unknown-linux-gnu.tar.gz from that version's GitHub release.
env:
  PINNED_UV: "0.11.9"
  PINNED_UV_SHA256: "5c43f82077ff0cd5aec588286cbabd89913e4d045bd4e8aa60b20b3ecffc36e3"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package claims to support, oldest first.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
      # The build backend at the versions and hashes the release uses.
      - run: uv build -b .github/build-constraints.txt --require-hashes
      - name: The metadata and README PyPI will render
        run: uvx twine==7.0.0 check --strict dist/*
