name: release

# Publishes to PyPI when a version tag like v0.1.0 is pushed. See RELEASING.md.
#
# The jobs are split by what they trust. build makes dist/ from the tagged
# source with nothing but uv and the pinned build backend, and records its
# digest. test and check run third-party code (pytest and its plugins, twine,
# the wheel's dependencies) on runners of their own. publish, the one job PyPI
# trusts, runs only pypa's action, and only on files whose digest is build's.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# uv at a fixed version, checked against its sha256: no run picks up a uv
# release nobody chose. To move it, take the sha256 of
# uv-x86_64-unknown-linux-gnu.tar.gz from that version's GitHub release.
env:
  PINNED_UV: "0.11.9"
  PINNED_UV_SHA256: "5c43f82077ff0cd5aec588286cbabd89913e4d045bd4e8aa60b20b3ecffc36e3"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          # Nothing in a release comes from a cache another run saved.
          enable-cache: false

      # A tag that disagrees with the package version would publish a release
      # whose name lies about its contents, and PyPI never lets a version be
      # replaced once it exists.
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          code=$(grep -m1 '^__version__' src/systemone/__init__.py | cut -d'"' -f2)
          if [ "$tag" != "$version" ] || [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag, pyproject $version and __version__ $code must all match"
            exit 1
          fi

      # The build backend at fixed versions, checked against their hashes.
      - run: uv build -b .github/build-constraints.txt --require-hashes

      - name: Digest of the files to publish
        id: digest
        run: echo "digest=$(cd dist && sha256sum * | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          # Nothing in a release comes from a cache another run saved.
          enable-cache: false

      - name: Test on the oldest and newest supported Python
        run: |
          for py in 3.10 3.13; do
            uv run --python "$py" --locked pytest -q
          done

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.PINNED_UV }}
          checksum: ${{ env.PINNED_UV_SHA256 }}
          # Nothing in a release comes from a cache another run saved.
          enable-cache: false

      - run: uvx twine==7.0.0 check --strict dist/*

      - name: The wheel installs and runs in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/systemone version

  publish:
    needs: [build, test, check]
    runs-on: ubuntu-latest
    # Bound to the PyPI trusted publisher, and gated by the environment's
    # required reviewer: nothing reaches PyPI without a click.
    environment:
      name: pypi
      url: https://pypi.org/project/systemonemodels/
    permissions:
      # Trusted Publishing, and the signature on each file.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # test and check ran other code in this run, which can replace an
      # artifact; the digest from build's own outputs cannot be.
      - name: The files are the ones build made
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          actual=$(cd dist && sha256sum * | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::dist/ is not what the build job made"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
